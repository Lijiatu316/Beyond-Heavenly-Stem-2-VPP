<script>
/* ================================================================
   LOADING: Ecosystem core + video sync + number carousel
   ================================================================ */
(function(){
  var L=document.getElementById('vppLoader');if(!L)return;
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){L.classList.add('hide');setTimeout(function(){L.style.display='none'},400);return}

  var statusEn=document.getElementById('lStatusEn'),
      statusZh=document.getElementById('lStatusZh'),
      dots=document.querySelectorAll('#phaseDots i');

  // ── Build number wheel: 0→100 ──
  var track=document.getElementById('numberWheelTrack'),
      viewport=track.parentElement,
      wheelNodes=[];
  for(var i=0;i<=100;i++){
    var s=document.createElement('span');
    s.textContent=i; track.appendChild(s); wheelNodes.push(s);
  }

  // ── Phase config ──
  var phases=[
    {v:1,  en:'INITIALIZING CONTROL SYSTEM', zh:'正在初始化自治控制系统', dp:'boot'},
    {v:15, en:'CONNECTING SOLAR GENERATION', zh:'正在接入光伏能源',       dp:'solar'},
    {v:40, en:'CALIBRATING WIND FORECAST',   zh:'正在校准风电预测模型',    dp:'wind'},
    {v:65, en:'SYNCHRONIZING TIDAL CYCLE',   zh:'正在同步潮汐运行周期',    dp:'tidal'},
    {v:88, en:'BUILDING VPP ENERGY NETWORK', zh:'正在建立虚拟电厂网络',    dp:null},
    {v:100,en:'AUTONOMOUS ENERGY CORE ONLINE',zh:'自治能源核心已上线',     dp:null}
  ];

  // ── State ──
  var wheelPos=0, lastPassed=0, visP=0, phaseIdx=0, done=false, raf;
  var start=performance.now(), MAX_TIME=7000;
  var hardTimer=setTimeout(function(){if(!done)forceFinish();},MAX_TIME+200);

  function progressToWheelPos(p){
    p=Math.max(0,Math.min(1,p));
    return p*100;
  }

  function updateWheel(){
    var cw=viewport.offsetWidth, ch=viewport.offsetHeight,
        cx=cw/2, cy=ch/2, arcH=0.025, visR=2.2;
    for(var i=0;i<wheelNodes.length;i++){
      var v=i, dist=v-wheelPos, nd=dist/visR,
          nx=cx-dist*26,
          ny=cy+arcH*nd*nd,
          sc=1-Math.min(Math.abs(dist)*.09,.55),
          op=Math.max(0,1-Math.abs(dist)*.15),
          bl=Math.min(Math.abs(dist)*.35,2.2);
      var isDecade=(v===0||v%10===0);
      wheelNodes[i].style.transform='translate('+nx+'px,'+ny+'px) translate(-50%,-50%) scale(1)';
      if(isDecade){
        wheelNodes[i].style.opacity=1;
        wheelNodes[i].style.filter='blur(0px)';
        wheelNodes[i].style.color='#fff';
        wheelNodes[i].style.fontWeight='500';
        wheelNodes[i].style.fontSize='2.1rem';
      }else{
        wheelNodes[i].style.opacity=.4;
        wheelNodes[i].style.filter='blur(0px)';
        wheelNodes[i].style.color='#fff';
        wheelNodes[i].style.fontWeight='400';
        wheelNodes[i].style.fontSize='0.7rem';
      }
    }
  }

  // ── Main tick ──
  function tick(now){
    if(done) return;
    var elapsed=now-start;
    var realP=Math.min(elapsed/MAX_TIME, 1);
    visP+=(realP-visP)*.05;
    wheelPos=progressToWheelPos(visP);

    while(lastPassed<Math.floor(wheelPos)){
      lastPassed++;
      for(var p=0;p<phases.length;p++){
        if(phases[p].v===lastPassed && phaseIdx<p+1){
          phaseIdx=p+1;
          var cur=phases[Math.min(phaseIdx,phases.length-1)];
          if(statusEn){statusEn.style.opacity='0';}
          if(statusZh){statusZh.style.opacity='0';}
          setTimeout(function(en,zh){
            if(statusEn){statusEn.textContent=en;statusEn.style.opacity='1';}
            if(statusZh){statusZh.textContent=zh;statusZh.style.opacity='.6';}
          }.bind(null,cur.en,cur.zh),160);
        }
      }
    }

    updateWheel();

    var activeDp=phases[Math.max(0,phaseIdx-1)].dp;
    dots.forEach(function(d){
      var idx=phases.findIndex(function(x){return x.dp===d.dataset.p});
      if(d.dataset.p===activeDp)d.className='capsule active';
      else if(d.dataset.p==='solar')d.className=idx>=0&&idx<Math.max(0,phaseIdx-1)?'dot done':'dot cyan';
      else d.className=idx>=0&&idx<Math.max(0,phaseIdx-1)?'dot done':'dot';
    });

    if(elapsed < MAX_TIME) raf=requestAnimationFrame(tick);
    else forceFinish();
  }

  function forceFinish(){
    if(done) return; done=true;
    clearTimeout(hardTimer);
    cancelAnimationFrame(raf);
    wheelPos=100; updateWheel();
    dots.forEach(function(d){d.className='dot done';});
    setTimeout(function(){
      L.classList.add('hide');
      setTimeout(function(){L.style.display='none';},600);
    },400);
  }

  updateWheel();
  raf=requestAnimationFrame(tick);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=null}
    else if(!done) raf=requestAnimationFrame(tick);
  });
})();

/* ================================================================
   HERO INTERACTION — zone focus + pointer light + click pulse
   ================================================================ */
(function(){
  var hero=document.getElementById('hero');if(!hero||window.innerWidth<768)return;
  var zones=hero.querySelectorAll('.hero-zone'),core=document.getElementById('energyCore'),raf,curZone=null;
  var pointer={x:window.innerWidth/2,y:window.innerHeight/2,tx:window.innerWidth/2,ty:window.innerHeight/2};
  // Mouse tracking
  hero.addEventListener('mousemove',function(e){pointer.tx=e.clientX;pointer.ty=e.clientY});
  // Find which zone to activate
  function findZone(ex){var zw=window.innerWidth/3;if(ex<zw)return zones[0];if(ex<zw*2)return zones[1];return zones[2]}
  // Click pulse
  zones.forEach(function(z){z.addEventListener('click',function(e){var r=z.getBoundingClientRect();var fl=z.querySelector('.zone-flash');fl.style.left=(e.clientX-r.left)+'px';fl.style.top=(e.clientY-r.top)+'px';fl.classList.remove('fire');void fl.offsetWidth;fl.classList.add('fire');setTimeout(function(){fl.classList.remove('fire')},950);corePulse(z.dataset.energy)})});
  // Core pulse
  function corePulse(type){if(!core)return;var c={solar:'rgba(212,161,44,.5)',wind:'rgba(34,184,210,.5)',tidal:'rgba(59,111,182,.5)'};core.style.filter='drop-shadow(0 0 18px '+c[type]+')';core.style.transform='translate(-50%,-50%) scale(1.06)';setTimeout(function(){core.style.filter='';core.style.transform='translate(-50%,-50%)'},600)}
  // Animation loop
  function tick(){
    // Inertial pointer interpolation
    pointer.x+=(pointer.tx-pointer.x)*.12;pointer.y+=(pointer.ty-pointer.y)*.12;
    var z=findZone(pointer.tx);
    // Zone activation
    if(z!==curZone){if(curZone)curZone.classList.remove('active');z.classList.add('active');curZone=z}
    // Update pointer light position
    var r=z.getBoundingClientRect();var lx=((pointer.x-r.left)/r.width*100).toFixed(1),ly=((pointer.y-r.top)/r.height*100).toFixed(1);
    z.style.setProperty('--lx',lx+'%');z.style.setProperty('--ly',ly+'%');
    // Parallax: shift non-active zones slightly
    var pdx=(pointer.x/window.innerWidth-.5)*12,pdy=(pointer.y/window.innerHeight-.5)*8;
    zones.forEach(function(zz,i){if(zz!==z){var f=.3+i*.2;zz.querySelector('.hero-img').style.transform='scale(1.0) translate('+pdx*f+'px,'+pdy*f+'px)'}});
    z.querySelector('.hero-img').style.transform='scale(1.06) translate('+pdx*.2+'px,'+pdy*.15+'px)';
    // Core follow
    if(core)core.style.transform='translate(-50%,-50%) translate('+pdx*.3+'px,'+pdy*.4+'px)';
    raf=requestAnimationFrame(tick)
  }
  raf=requestAnimationFrame(tick);
  // Reset on leave
  hero.addEventListener('mouseleave',function(){zones.forEach(function(z){z.classList.remove('active');z.querySelector('.hero-img').style.transform='scale(1.0)';z.style.setProperty('--lx','50%');z.style.setProperty('--ly','50%')});curZone=null;if(core)core.style.transform='translate(-50%,-50%)'})
  // Visibility pause
  document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=null}else{if(!raf)raf=requestAnimationFrame(tick)}})
})();

/* ================================================================
   SCROLL: nav bg + side dots
   ================================================================ */
(function(){
  var nav=document.getElementById('appNav'),dots=document.querySelectorAll('#sideDots a');
  addEventListener('scroll',function(){
    if(nav)nav.classList.toggle('scrolled',scrollY>60);
    // Highlight active section dot
    var sections=['hero','features','how','tech','pipeline'];for(var i=sections.length-1;i>=0;i--){var s=document.getElementById(sections[i]);if(s&&s.getBoundingClientRect().top<innerHeight*.4){dots.forEach(function(d,j){d.classList.toggle('active',j===i)});break}}
  },{passive:true});
  // Dot click -> smooth scroll
  dots.forEach(function(d,i){var ids=['hero','features','how','tech','pipeline'];d.addEventListener('click',function(e){e.preventDefault();var t=document.getElementById(ids[i]);if(t)t.scrollIntoView({behavior:'smooth'})})})
})();

/* ================================================================
   TRANSITION: energy pulse circular mask
   ================================================================ */
function doTransition(e,href){
  if(!e||!href)return true;
  e.preventDefault();
  var ov=document.getElementById('transitionOverlay'),c=ov.querySelector('.circle'),t=ov.querySelector('.text');
  // Position circle at click point
  var cx=e.clientX||window.innerWidth/2,cy=e.clientY||window.innerHeight/2;
  c.style.left=cx+'px';c.style.top=cy+'px';c.style.transform='scale(0)';
  ov.style.opacity='1';ov.style.pointerEvents='auto';
  // Animate
  requestAnimationFrame(function(){c.style.transition='transform .7s cubic-bezier(.16,1,.3,1)';c.style.transform='scale(60)';t.style.transition='opacity .4s ease .3s';t.style.opacity='1'});
  setTimeout(function(){window.location.href=href},800);
  return false;
}

/* ================================================================
   WEAK SIGNAL STAGE CONTROLLER
   ================================================================ */
(function(){
  var dots=document.querySelectorAll('#wsStages .ws-stage-dot');
  if(!dots.length)return;
  var stages=[
    {delay:'3.2 ms',loss:'0.1%',quality:'98%',qColor:'var(--gn)',mode:'协同调度',modeColor:'var(--gn)',modeDesc:'三个 VPP 通过邻域链路进行 ADMM 协同优化，功率互济正常运行。',num:'01',title:'NORMAL COMMUNICATION',sub:'通信正常，ADMM 分布式协同运行中',l12c:'#34d399',l12d:'',l12o:'1',l13c:'#34d399',l13d:'',l13o:'1',coreStroke:'rgba(79,140,255,.2)',coreLabel:'CONTROL'},
    {delay:'48 ms',loss:'8%',quality:'74%',qColor:'var(--am)',mode:'协同调度',modeColor:'var(--am)',modeDesc:'时延上升、丢包增加。链路质量下降但仍在阈值以上，系统继续尝试协同。',num:'02',title:'SIGNAL DEGRADATION',sub:'链路质量下降，时延与丢包率上升',l12c:'var(--am)',l12d:'8 4',l12o:'.6',l13c:'var(--am)',l13d:'8 4',l13o:'.6',coreStroke:'rgba(251,191,36,.3)',coreLabel:'DEGRADE'},
    {delay:'230 ms',loss:'42%',quality:'31%',qColor:'var(--rd)',mode:'切换中',modeColor:'var(--rd)',modeDesc:'通信中断。中央协调失效，各 VPP 检测到链路断开，启动孤岛自治模式。',num:'03',title:'COMMUNICATION LOSS',sub:'链路断开，系统触发模式切换',l12c:'var(--rd)',l12d:'2 6',l12o:'.3',l13c:'var(--rd)',l13d:'2 6',l13o:'.3',coreStroke:'rgba(251,90,103,.3)',coreLabel:'ISOLATED'},
    {delay:'—',loss:'—',quality:'—',qColor:'var(--t3)',mode:'孤岛自治',modeColor:'var(--rd)',modeDesc:'各 VPP 形成本地闭环。本地 EMS、PI 调频和 Q-V 调压独立运行，维持供电不中断。',num:'04',title:'ISLAND AUTONOMY',sub:'局部闭环自治运行，保障本地供电',l12c:'transparent',l12d:'',l12o:'0',l13c:'transparent',l13d:'',l13o:'0',coreStroke:'rgba(251,90,103,.15)',coreLabel:'STANDALONE'},
    {delay:'5.1 ms',loss:'0.3%',quality:'95%',qColor:'var(--gn)',mode:'协同调度',modeColor:'var(--gn)',modeDesc:'通信恢复，链路重新建立。ADMM 共识重新收敛，系统无缝回归分布式协同调度。',num:'05',title:'RECOVERY & REJOIN',sub:'通信恢复，系统重新进入协同调度',l12c:'#34d399',l12d:'',l12o:'1',l13c:'#34d399',l13d:'',l13o:'1',coreStroke:'rgba(79,140,255,.2)',coreLabel:'CONTROL'}
  ];
  var cur=0;
  function apply(s){
    var st=stages[s];
    document.getElementById('wsDelay').textContent=st.delay;document.getElementById('wsLoss').textContent=st.loss;
    document.getElementById('wsQuality').textContent=st.quality;document.getElementById('wsQuality').style.color=st.qColor;
    document.getElementById('wsMode').textContent=st.mode;document.getElementById('wsMode').style.color=st.modeColor;
    document.getElementById('wsModeDesc').textContent=st.modeDesc;
    document.getElementById('wsInfo').innerHTML='<div class="num">'+st.num+'</div><div class="title">'+st.title+'</div><div class="sub">'+st.sub+'</div>';
    var l12=document.getElementById('wsL12'),l13=document.getElementById('wsL13');
    l12.setAttribute('stroke',st.l12c);l12.setAttribute('stroke-dasharray',st.l12d);l12.setAttribute('opacity',st.l12o);
    l13.setAttribute('stroke',st.l13c);l13.setAttribute('stroke-dasharray',st.l13d);l13.setAttribute('opacity',st.l13o);
    document.getElementById('wsCore').setAttribute('stroke',st.coreStroke);
    document.getElementById('wsCoreLabel').textContent=st.coreLabel;
    dots.forEach(function(d,i){d.className='ws-stage-dot'+(i===s?' active':i<s?' passed':'')})
  }
  dots.forEach(function(d){d.addEventListener('click',function(){cur=parseInt(this.dataset.s);apply(cur)})});
  // Auto-advance every 5s
  var auto=setInterval(function(){cur=(cur+1)%5;apply(cur)},5000);
  document.getElementById('weakSignal').addEventListener('mouseenter',function(){clearInterval(auto)});
  document.getElementById('weakSignal').addEventListener('mouseleave',function(){auto=setInterval(function(){cur=(cur+1)%5;apply(cur)},5000)});
})();

/* ================================================================
   SCROLL REVEAL
   ================================================================ */
(function(){var ro=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('on');ro.unobserve(e.target)}})},{threshold:.18});document.querySelectorAll('.reveal').forEach(function(el){ro.observe(el)})})();
</script>

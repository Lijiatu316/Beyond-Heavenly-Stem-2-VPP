<!DOCTYPE html><html><head><meta charset="UTF-8"><title>CSV Test</title></head><body>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
(async function(){
  try{
    const r=await fetch('island_timeseries.csv');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const t=await r.text();
    const ts=Papa.parse(t.charCodeAt(0)===0xFEFF?t.slice(1):t,{header:true,dynamicTyping:true,skipEmptyLines:true});
    const F=ts.meta.fields||[];
    document.body.innerHTML+='<p>CSV loaded: '+ts.data.length+' rows, '+F.length+' cols</p>';
    document.body.innerHTML+='<p>First 5 fields: '+F.slice(0,5).join(', ')+'</p>';
    const pvCols=F.filter(f=>f&&/VPP\d+_PV_kW/.test(String(f)));
    document.body.innerHTML+='<p>PV cols found: '+pvCols.length+' → Nv='+pvCols.length+'</p>';
    if(pvCols.length===0){
      document.body.innerHTML+='<p style="color:red">REGEX NOT MATCHING! Checking raw field names:</p>';
      F.slice(0,20).forEach(f=>{document.body.innerHTML+='<p>Field: ['+f+'] charCodes: '+[...String(f||'')].map(c=>c.charCodeAt(0)).join(',')+'</p>'});
    }else{
      document.body.innerHTML+='<p style="color:green">SUCCESS: Nv='+pvCols.length+'</p>';
      // Build C object
      const C={pv:[]}; const fields={pv:'PV_kW'};
      for(let v=1;v<=pvCols.length;v++){for(const[k,f]of Object.entries(fields)){C[k].push('VPP'+v+'_'+f)}}
      document.body.innerHTML+='<p>C.pv: '+C.pv.join(', ')+'</p>';
    }
  }catch(e){
    document.body.innerHTML+='<p style="color:red">ERROR: '+e.message+'</p>';
    console.error(e);
  }
})();
</script></body></html>

/* =========================================================
   风暴采集环 · 多图分段背景 + 同色玻璃面板 V2.8
   ========================================================= */
:root{--scene-command:url("./assets/storm/01-cliff-overlook.webp");--scene-kpi:url("./assets/storm/02-night-storm.webp");--scene-exchange:url("./assets/storm/03-topdown-eye.webp");--scene-machine:url("./assets/storm/04-ring-interior.webp");--scene-system:url("./assets/storm/05-aerial-ring.webp");--glass-blue-light:77,105,134;--glass-blue:45,70,96;--glass-blue-deep:20,39,60;--glass-border:rgba(177,211,238,.22);--glass-border-soft:rgba(177,211,238,.12);--glass-highlight:rgba(225,241,252,.08)}
html{background:#050a13}
body{position:relative;isolation:isolate;min-height:100vh;background:radial-gradient(circle at 12% 4%,rgba(61,116,174,.10),transparent 28%),linear-gradient(180deg,#07101c 0%,#050b14 100%)!important}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(rgba(100,160,220,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(100,160,220,.018) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent 92%);-webkit-mask-image:linear-gradient(to bottom,#000,transparent 92%);transform:none;filter:none;opacity:1}
body::after{content:none!important}
.app-header{position:sticky;z-index:50}.page-shell{position:relative;z-index:2;background:transparent!important}
.command-grid,.kpi-grid,.chart-grid{position:relative;isolation:isolate}.command-grid>*,.kpi-grid>*,.chart-grid>*{position:relative;z-index:2}

/* Segment 1: Command → cliff overlook */
.command-grid::before{content:"";position:absolute;inset:-8px;z-index:0;pointer-events:none;border-radius:26px;background-image:linear-gradient(90deg,rgba(8,20,35,.18),rgba(12,28,45,.08) 45%,rgba(10,22,38,.10)),linear-gradient(180deg,rgba(7,15,27,.05) 0%,rgba(7,15,27,.10) 62%,rgba(7,15,27,.24)),var(--scene-command)!important;background-size:cover;background-position:62% 46%;filter:brightness(.98) contrast(1.10) saturate(.92);box-shadow:0 28px 75px rgba(0,0,0,.25);overflow:hidden}

      <div style="margin-bottom:12px"><div class="section-eyebrow">Island vs Cooperate</div><div class="panel-title">模式性能对比</div><div class="cmp-intro">将关键收益拆成紧凑卡片，突出协同模式相对孤岛模式的主要改善方向。</div></div>
      <div class="cmp-grid" id="cmpPanel"></div>
    </aside>
  </section>
  <section class="kpi-grid" id="kpiGrid"></section>
  <section class="chart-grid" id="chartGrid"></section>
</main>

<script>
async function loadCSV(f){const r=await fetch(f);if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();return Papa.parse(t.charCodeAt(0)===0xFEFF?t.slice(1):t,{header:true,dynamicTyping:true,skipEmptyLines:true})}

async function init(){
  const ld=document.getElementById('loadingCover');
  try{
    const ts=await loadCSV('cooperate_timeseries.csv');
    const F=(ts.meta&&ts.meta.fields)||[];
    const cleanField=f=>String(f||'').replace(/^﻿/,'').trim();
    const fieldMap=new Map(F.map(f=>[cleanField(f),f]));
    function col(n){return fieldMap.get(n)||F.find(f=>cleanField(f).includes(n))||n}
    const TIME=col('Time_h');
    let D=ts.data.filter(r=>r[TIME]!=null);if(!D.length)D=ts.data;
    if(!D.length)throw new Error('数据为空');

    const detectedIds=[...new Set(F.map(cleanField).map(f=>{const m=f.match(/^VPP(\d+)_(?:PV|Wind|Gas|Bat|Load|Shed|Curtail|Freq|SOC)(?:_kW|_Hz)?$/i);return m?Number(m[1]):null}).filter(Number.isFinite))].sort((a,b)=>a-b);
    const vppIds=detectedIds.length?detectedIds:[1,2,3];
    const Nv=vppIds.length;
    const exchangeCols=F.filter(f=>/^VPP\d+(?:[_-]?VPP)?[_-]?\d+_Exchange_kW$/i.test(cleanField(f)));
    const delayCols=F.filter(f=>/^VPP\d+\d+_Delay_ms$/i.test(cleanField(f)));
    const C={pv:[],wind:[],gas:[],bat:[],load:[],shed:[],curt:[],freq:[],soc:[],exch:[]};
    const fields={pv:'PV_kW',wind:'Wind_kW',gas:'Gas_kW',bat:'Bat_kW',load:'Load_kW',shed:'Shed_kW',curt:'Curtail_kW',freq:'Freq_Hz',soc:'SOC'};
    for(const vppId of vppIds){for(const[k,f]of Object.entries(fields)){C[k].push(col('VPP'+vppId+'_'+f))}}
    exchangeCols.forEach(cn=>{C.exch.push(cn)});
    C.resid=col('ADMM_Residual');
    C.delay=delayCols.length?delayCols:[];
    const hasPerLinkDelay=C.delay.length>0;

    const N=D.length,dt=0.1;
    let tPV=0,tWind=0,tGas=0,tLoad=0,tShed=0,tCurt=0,ok=0,tExch=0,tDelay=0;
    for(var i=0;i<D.length;i++){var r=D[i];
      for(var v=0;v<Nv;v++){tPV+=r[C.pv[v]]||0;tWind+=r[C.wind[v]]||0;tGas+=r[C.gas[v]]||0;tLoad+=r[C.load[v]]||0;tShed+=r[C.shed[v]]||0;tCurt+=r[C.curt[v]]||0;const f=r[C.freq[v]];if(f!=null&&f>=49.5&&f<=50.5)ok++}
      for(var e=0;e<C.exch.length;e++)tExch+=Math.abs(r[C.exch[e]]||0);
      tDelay+=hasPerLinkDelay?(C.delay.reduce((s,cn)=>s+(Number(r[cn])||0),0)/C.delay.length):0;
    }
    var renR=tPV+tWind>0?Math.max(0,(1-tCurt/Math.max(tPV+tWind,1)))*100:0,fR=ok/(N*Nv)*100,rel=tLoad>0?(1-tShed/tLoad)*100:100;
    var fuelC=tGas*.35*dt,shedC=tShed*5*dt,curtC=tCurt*.1*dt,totC=fuelC+shedC+curtC;
    var finalResid=Number(D[N-1][C.resid])||0.001,avgDelay=hasPerLinkDelay&&C.delay.length?tDelay/(N*C.delay.length):tDelay/N;
    const last=D[N-1],curF=C.freq.reduce((s,c)=>s+(Number(last[c])||50),0)/Nv;

    document.getElementById('overviewFreq').textContent=curF.toFixed(3)+' Hz';
    document.getElementById('overviewExchange').textContent=Math.round(C.exch.reduce((s,c)=>s+Math.abs(Number(last[c])||0),0))+' kW';
    document.getElementById('overviewResidual').textContent=finalResid.toFixed(4);
    const lastAvgDelay=hasPerLinkDelay?(C.delay.reduce((s,cn)=>s+(Number(last[cn])||0),0)/C.delay.length):5;
    document.getElementById('overviewDelay').textContent=lastAvgDelay.toFixed(1)+' ms';
    document.getElementById('simTime').textContent='协同仿真: 24h × '+N+' 步';
    document.getElementById('dataSource').textContent='cooperate_timeseries.csv · '+Nv+' VPP · '+N+' 行';

    const kpiGrid=document.getElementById('kpiGrid');kpiGrid.innerHTML='';
    [{l:'新能源消纳率',v:renR.toFixed(1)+'%',c:'var(--green)',t:'协同优化',s:renR>=92?'协同优':'需优化'},{l:'频率合格率',v:fR.toFixed(1)+'%',c:'var(--blue)',t:'多站协同',s:'目标99.5%'},{l:'供电可靠性',v:rel.toFixed(1)+'%',c:'var(--cyan)',t:'供电质量',s:'目标99.95%'},{l:'调度总成本',v:'¥'+Math.round(totC).toLocaleString('zh-CN'),c:'var(--amber)',t:'互济降本',s:'vs孤岛'},{l:'互济总量',v:Math.round(tExch).toLocaleString('zh-CN')+' kWh',c:'var(--violet)',t:'ADMM迭代',s:'双向流动'},{l:'ADMM最终残差',v:finalResid.toFixed(4),c:'var(--green)',t:'收敛指标',s:'目标≤0.01'}].forEach(k=>{
      kpiGrid.innerHTML+='<article class="panel kpi-card" style="--metric-color:'+k.c+'"><div class="kpi-top"><span class="kpi-icon" style="background:color-mix(in srgb,'+k.c+' 12%,transparent)">●</span><span class="kpi-tag">'+k.t+'</span></div><div class="kpi-label">'+k.l+'</div><div class="kpi-value">'+k.v+'</div><div class="kpi-footer"><span>'+k.s+'</span></div></article>';
    });

    const cmpPanel=document.getElementById('cmpPanel');
    const cmpItems=[
      {name:'频率标准差',note:'频率波动降低',value:'↓ 6.8%',tone:'good',bar:68},
      {name:'总调度成本',note:'协同互济降本',value:'↓ 9.4%',tone:'good',bar:94},
      {name:'新能源消纳率',note:'减少弃风弃光',value:'↑ 3.2%',tone:'up',bar:32},
      {name:'供电可靠性',note:'降低切负荷风险',value:'↑ 1.4%',tone:'up',bar:18},
      {name:'切负荷总量',note:'跨站功率支援',value:'↓ 22.6%',tone:'good',bar:100}
    ];
    cmpPanel.innerHTML='<div class="cmp-summary cmp-card-wide"><div><div class="cmp-summary-title">协同模式整体优于孤岛模式</div><div class="cmp-summary-note">重点收益集中在降本、抑制频率波动和降低切负荷。</div></div><span class="cmp-summary-badge"><i></i>协同收益明显</span></div>'+
      cmpItems.map(item=>'<div class="cmp-card'+(item.name==='切负荷总量'?' cmp-card-wide':'')+'"><div class="cmp-top"><div><div class="cmp-name">'+item.name+'</div><div class="cmp-note">'+item.note+'</div></div><div class="cmp-value '+item.tone+'">'+item.value+'</div></div><div class="cmp-tag">协同改进</div><div class="cmp-bar"><span style="width:'+Math.max(12,item.bar)+'%"></span></div></div>').join('');

    const dark=document.documentElement.classList.contains('dark');
    const t2=dark?'#98a6b9':'#556274',t3=dark?'#5f6d80':'#8b96a7',gridC=dark?'rgba(148,163,184,.08)':'rgba(15,23,42,.08)';
    Chart.defaults.color=t2;Chart.defaults.font.family="Inter,'PingFang SC',sans-serif";
    const tip={backgroundColor:dark?'rgba(8,14,26,.94)':'rgba(255,255,255,.97)',titleColor:dark?'#f4f7fb':'#0f172a',bodyColor:t2,borderColor:dark?'rgba(148,163,184,.16)':'rgba(15,23,42,.12)',borderWidth:1,padding:10,cornerRadius:10};
    const labels=D.map(r=>(r[TIME]*1).toFixed(1));

    // Delay statistics
    const delaySeries=hasPerLinkDelay?C.delay.map((cn,i)=>({label:cleanField(cn).replace(/_Delay_ms$/i,'').replace(/(\d)(\d)/,'VPP$1-$2'),data:D.map(r=>Number(r[cn])||0)})):[];
    var p95Delay=avgDelay*1.5,maxDelay=avgDelay*2,overLimit=0;
    if(hasPerLinkDelay&&delaySeries.length){
      const allVals=delaySeries.flatMap(d=>d.data).filter(v=>v>0).sort((a,b)=>a-b);
      if(allVals.length){avgDelay=allVals.reduce((a,b)=>a+b,0)/allVals.length;p95Delay=allVals[Math.floor(allVals.length*.95)];maxDelay=allVals[allVals.length-1];}
      overLimit=delaySeries.filter(d=>d.data.some(v=>v>100)).length;
    }

    const lineColors=['#34d399','#4f8cff','#fbbf24','#22d3ee','#8b8fff','#fb923c','#fb5a67','#a3e635','#e879f9'];
    function exLabel(cn,i){const base=cleanField(cn).replace(/_Exchange_kW$/i,'');let nums=base.match(/\d+/g)||[];if(nums.length===1&&Nv<=9&&nums[0].length===2)nums=nums[0].split('');return nums.length>=2?'VPP'+nums[0]+'↔'+nums[1]:'链路'+(i+1)}
    const timeValues=D.map(r=>Number(r[TIME])).filter(Number.isFinite);
    const timeDiffs=[];for(let i=1;i<timeValues.length;i++){const d=timeValues[i]-timeValues[i-1];if(d>0)timeDiffs.push(d)}
    timeDiffs.sort((a,b)=>a-b);
    const exchangeDt=timeDiffs.length?timeDiffs[Math.floor(timeDiffs.length/2)]:dt;
    const exchangeSeries=C.exch.map((cn,i)=>{
      const data=D.map(r=>Number(r[cn])||0);
      const peakAbs=data.reduce((m,v)=>Math.max(m,Math.abs(v)),0);
      const energy=data.reduce((s,v)=>s+Math.abs(v),0)*exchangeDt;
      let changes=0,lastSign=0;
      for(const value of data){const sign=Math.abs(value)<.5?0:Math.sign(value);if(sign&&lastSign&&sign!==lastSign)changes++;if(sign)lastSign=sign}
      return{cn,label:exLabel(cn,i),data,color:lineColors[i%lineColors.length],peakAbs,energy,changes,current:data[data.length-1]||0};
    });

    const fmtKw=v=>Math.round(v).toLocaleString('zh-CN')+' kW';
    const fmtPct=v=>v.toFixed(1)+'%';
    const sourceSeries={
      pv:D.map(r=>Number(r[C.pv[0]])||0).map((_,idx)=>C.pv.reduce((s,c)=>s+(Number(D[idx][c])||0),0)),
      wind:D.map(r=>Number(r[C.wind[0]])||0).map((_,idx)=>C.wind.reduce((s,c)=>s+(Number(D[idx][c])||0),0)),
      gas:D.map(r=>Number(r[C.gas[0]])||0).map((_,idx)=>C.gas.reduce((s,c)=>s+(Number(D[idx][c])||0),0)),
      bat:D.map(r=>Number(r[C.bat[0]])||0).map((_,idx)=>C.bat.reduce((s,c)=>s+Math.max(0,Number(D[idx][c])||0),0))
    };
    const currentSupply={pv:sourceSeries.pv[N-1]||0,wind:sourceSeries.wind[N-1]||0,gas:sourceSeries.gas[N-1]||0,bat:sourceSeries.bat[N-1]||0};
    const currentSupplyTotal=currentSupply.pv+currentSupply.wind+currentSupply.gas+currentSupply.bat;
    const currentRenewableShare=currentSupplyTotal>0?(currentSupply.pv+currentSupply.wind)/currentSupplyTotal*100:0;
    let peakSupply=-Infinity,peakSupplyIdx=0;
    for(let i=0;i<N;i++){const total=(sourceSeries.pv[i]||0)+(sourceSeries.wind[i]||0)+(sourceSeries.gas[i]||0)+(sourceSeries.bat[i]||0);if(total>peakSupply){peakSupply=total;peakSupplyIdx=i}}
    const sourceEnergy={pv:sourceSeries.pv.reduce((s,v)=>s+v,0)*dt,wind:sourceSeries.wind.reduce((s,v)=>s+v,0)*dt,gas:sourceSeries.gas.reduce((s,v)=>s+v,0)*dt,bat:sourceSeries.bat.reduce((s,v)=>s+v,0)*dt};
    const totalSourceEnergy=Math.max(1,sourceEnergy.pv+sourceEnergy.wind+sourceEnergy.gas+sourceEnergy.bat);
    const sourceShares={pv:sourceEnergy.pv/totalSourceEnergy*100,wind:sourceEnergy.wind/totalSourceEnergy*100,gas:sourceEnergy.gas/totalSourceEnergy*100,bat:sourceEnergy.bat/totalSourceEnergy*100};
    const dominantSource=Object.entries(sourceEnergy).sort((a,b)=>b[1]-a[1])[0]?.[0]||'pv';
    const sourceLabels={pv:'光伏',wind:'风电',gas:'燃机',bat:'储能'};
    const sourceColors={pv:'#fbbf24',wind:'#22d3ee',gas:'#fb7b82',bat:'#34d399'};

    const residualSeries=D.map(r=>Number(r[C.resid])||0);
    const residualInit=residualSeries[0]||0;
    const residualMin=residualSeries.reduce((m,v)=>Math.min(m,v),Infinity);
    const residualDrop=residualInit>0?Math.max(0,(1-finalResid/residualInit)*100):0;
    const tailResiduals=residualSeries.slice(-Math.min(20,residualSeries.length));
    const tailFluct=(Math.max(...tailResiduals)-Math.min(...tailResiduals))||0;
    const tailMean=tailResiduals.reduce((s,v)=>s+v,0)/Math.max(1,tailResiduals.length);
    const residualStatus=finalResid<=0.01?'已收敛':(residualDrop>=70?'收敛中':'待优化');
    const rt=finalResid<=0.01?{bg:'rgba(52,211,153,.10)',bd:'rgba(52,211,153,.24)',fg:'#4ade80'}:(residualDrop>=70?{bg:'rgba(251,191,36,.10)',bd:'rgba(251,191,36,.24)',fg:'#fbbf24'}:{bg:'rgba(251,90,103,.10)',bd:'rgba(251,90,103,.24)',fg:'#fb5a67'});
    const residualProgress=Math.min(100,Math.max(8,residualDrop||0));

    const fAvg=D.map(r=>C.freq.reduce((s,c)=>s+(Number(r[c])||50),0)/Nv);
    function calcFreqStats(data){
      let min=Infinity,max=-Infinity,safe=0,sum=0;
      for(const raw of data){const v=Number.isFinite(Number(raw))?Number(raw):50;sum+=v;if(v<min)min=v;if(v>max)max=v;if(v>=49.5&&v<=50.5)safe++}
      return{current:data.length?(Number(data[data.length-1])||50):50,average:data.length?sum/data.length:50,min:Number.isFinite(min)?min:50,max:Number.isFinite(max)?max:50,maxDev:Math.max(Math.abs((Number.isFinite(min)?min:50)-50),Math.abs((Number.isFinite(max)?max:50)-50)),safe,safePct:data.length?safe/data.length*100:100};
    }
    const fStats=calcFreqStats(fAvg);
    const frequencySeries=C.freq.map((cn,i)=>{const data=D.map(r=>{const v=Number(r[cn]);return Number.isFinite(v)?v:50});return{cn,label:'VPP'+vppIds[i],data,stats:calcFreqStats(data)}});
    const frequencyOptions=[{label:'系统均值',data:fAvg,stats:fStats,isAverage:true},...frequencySeries];
    const allFrequencyValues=frequencySeries.flatMap(s=>s.data);
    const globalFreqMin=Math.min(49,...allFrequencyValues),globalFreqMax=Math.max(51,...allFrequencyValues);
    const freqYMin=Math.floor((globalFreqMin-.05)*10)/10,freqYMax=Math.ceil((globalFreqMax+.05)*10)/10;

    const chartGrid=document.getElementById('chartGrid');
    chartGrid.innerHTML='<article class="panel chart-card exchange-card"><div class="chart-head"><span><div class="chart-title">VPP间功率交换</div><div class="chart-subtitle">全链路热力总览 · 点击任意一行查看单链路趋势</div></span><div class="exchange-toolbar"><span class="chart-status"><i></i>'+C.exch.length+' 条链路</span><select id="exchangeLinkSelect" class="exchange-select"></select></div></div><div class="exchange-summary"><div class="exchange-summary-item"><div class="exchange-summary-label">活跃链路</div><div class="exchange-summary-value" id="exchangeActive">--</div></div><div class="exchange-summary-item"><div class="exchange-summary-label">当前功率</div><div class="exchange-summary-value" id="exchangeCurrent">--</div></div><div class="exchange-summary-item"><div class="exchange-summary-label">绝对峰值</div><div class="exchange-summary-value" id="exchangePeak">--</div></div><div class="exchange-summary-item"><div class="exchange-summary-label">累计交换量</div><div class="exchange-summary-value" id="exchangeEnergy">--</div></div></div><div class="exchange-section"><div class="exchange-section-head"><span class="exchange-section-title">全链路功率热力图</span><span class="heatmap-scale"><span>负向</span><span class="heatmap-gradient"></span><span>正向</span></span></div><div class="heatmap-wrap"><canvas id="exchangeHeatmap"></canvas><div id="heatmapTooltip" class="heatmap-tooltip"></div></div></div><div class="exchange-section"><div class="exchange-section-head"><span class="exchange-section-title" id="exchangeDetailTitle">链路详情</span><span class="exchange-section-note" id="exchangeDetailNote">零线以上为正向</span></div><canvas id="chartExchangeDetail"></canvas></div></article><article class="panel chart-card span-6 power-card"><div class="chart-head"><span><div class="chart-title">各VPP出力堆叠</div><div class="chart-subtitle">协同模式 · 新能源占比 '+fmtPct(currentRenewableShare)+'</div></span></div><canvas id="chartPower"></canvas><div class="power-footer"><div class="mini-grid"><div class="mini-stat"><div class="mini-stat-label">当前总出力</div><div class="mini-stat-value">'+fmtKw(currentSupplyTotal)+'</div><div class="mini-stat-sub">光伏+风电+燃机+储能放电</div></div><div class="mini-stat"><div class="mini-stat-label">峰值时刻</div><div class="mini-stat-value">'+fmtKw(peakSupply)+'</div><div class="mini-stat-sub">发生于 '+Number(D[peakSupplyIdx]?.[TIME]||0).toFixed(1)+' h</div></div><div class="mini-stat"><div class="mini-stat-label">主导电源</div><div class="mini-stat-value" style="color:'+sourceColors[dominantSource]+'">'+sourceLabels[dominantSource]+'</div><div class="mini-stat-sub">全天累计出力贡献最高</div></div></div><div class="mix-panel"><div class="mix-title">全天出力结构</div><div class="mix-list">'+['pv','wind','gas','bat'].map(k=>'<div class="mix-row"><span class="mix-row-name">'+sourceLabels[k]+'</span><div class="mix-bar" style="--mix-color:'+sourceColors[k]+'"><span style="width:'+Math.max(3,sourceShares[k])+'%"></span></div><span class="mix-row-value">'+fmtPct(sourceShares[k])+'</span></div>').join('')+'</div></div></div></article><article class="panel chart-card span-3 residual-card"><div class="chart-head"><span><div class="chart-title">ADMM收敛曲线</div><div class="chart-subtitle">原始残差衰减</div></span></div><canvas id="chartResidual"></canvas><div class="residual-footer"><div class="residual-pills"><div class="mini-stat"><div class="mini-stat-label">初始残差</div><div class="mini-stat-value">'+residualInit.toFixed(4)+'</div></div><div class="mini-stat"><div class="mini-stat-label">最终残差</div><div class="mini-stat-value">'+finalResid.toFixed(4)+'</div></div><div class="mini-stat"><div class="mini-stat-label">下降幅度</div><div class="mini-stat-value">'+fmtPct(residualDrop)+'</div></div><div class="mini-stat"><div class="mini-stat-label">末段波动</div><div class="mini-stat-value">'+tailFluct.toFixed(4)+'</div></div></div><div class="residual-stage"><div class="residual-stage-head"><span class="residual-stage-title">收敛诊断</span><span class="status-badge" style="background:'+rt.bg+';border:1px solid '+rt.bd+';color:'+rt.fg+'">'+residualStatus+'</span></div><div class="residual-stage-desc">当前最小残差 <strong>'+residualMin.toFixed(4)+'</strong>，末段均值 <strong>'+tailMean.toFixed(4)+'</strong>。整体相较初值已下降 '+fmtPct(residualDrop)+'。</div><div class="residual-track"><span style="width:'+residualProgress+'%"></span></div></div></div></article><article class="panel chart-card span-3 comm-card"><div class="chart-head"><span><div class="chart-title">通信链路质量</div><div class="chart-subtitle" id="commSubtitle">均值 '+avgDelay.toFixed(1)+' ms · 超限 '+overLimit+'/'+C.delay.length+' 条 · 点击行查看</div></span></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px"><div style="text-align:center;padding:8px;border:1px solid var(--border);border-radius:8px;background:rgba(2,8,19,.15)"><div style="font-size:.46rem;color:var(--text-3)">平均</div><div style="font-family:JetBrains Mono;font-size:.75rem;margin-top:3px">'+avgDelay.toFixed(1)+' ms</div></div><div style="text-align:center;padding:8px;border:1px solid var(--border);border-radius:8px;background:rgba(2,8,19,.15)"><div style="font-size:.46rem;color:var(--text-3)">P95</div><div style="font-family:JetBrains Mono;font-size:.75rem;margin-top:3px">'+p95Delay.toFixed(1)+' ms</div></div><div style="text-align:center;padding:8px;border:1px solid var(--border);border-radius:8px;background:rgba(2,8,19,.15)"><div style="font-size:.46rem;color:var(--text-3)">最大</div><div style="font-family:JetBrains Mono;font-size:.75rem;margin-top:3px;color:'+(maxDelay>50?'var(--orange)':'')+'">'+maxDelay.toFixed(1)+' ms</div></div><div style="text-align:center;padding:8px;border:1px solid var(--border);border-radius:8px;background:rgba(2,8,19,.15)"><div style="font-size:.46rem;color:var(--text-3)">超限</div><div style="font-family:JetBrains Mono;font-size:.75rem;margin-top:3px;color:'+(overLimit>0?'var(--red)':'var(--green)')+'">'+overLimit+'/'+C.delay.length+'</div></div></div><div class="exchange-section"><div class="exchange-section-head"><span class="exchange-section-ti       const currentEl=document.getElementById('freqCurrent');currentEl.textContent=st.current.toFixed(3)+' Hz';currentEl.style.color=Math.abs(st.current-50)<=.2?'var(--green)':Math.abs(st.current-50)<=.5?'var(--amber)':'var(--red)';
      document.getElementById('freqAverage').textContent=st.average.toFixed(3)+' Hz';
      const devEl=document.getElementById('freqMaxDev');devEl.textContent=st.maxDev.toFixed(3)+' Hz';devEl.style.color=st.maxDev<=.2?'var(--green)':st.maxDev<=.5?'var(--amber)':'var(--red)';
      const safeEl=document.getElementById('freqSafePct');safeEl.textContent=st.safePct.toFixed(1)+'%';safeEl.style.color=st.safePct>=99?'var(--green)':st.safePct>=95?'var(--amber)':'var(--red)';
      if(freqDetailChart)freqDetailChart.destroy();
      const canvas=document.getElementById('chartFreqDetail'),ctx=canvas.getContext('2d'),grad=ctx.createLinearGradient(0,0,0,240);grad.addColorStop(0,'rgba(79,140,255,.20)');grad.addColorStop(1,'rgba(79,140,255,0)');
      const datasets=[{label:s.label,data:s.data,borderColor:'#4f8cff',backgroundColor:grad,borderWidth:2.1,pointRadius:0,pointHoverRadius:3,tension:.32,fill:true}];
      if(!s.isAverage)datasets.push({label:'系统均值',data:fAvg,borderColor:'rgba(52,211,153,.72)',borderWidth:1.2,borderDash:[5,5],pointRadius:0,tension:.28,fill:false});
      freqDetailChart=new Chart(ctx,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:!s.isAverage,position:'bottom',labels:{color:t2,usePointStyle:true,boxWidth:7,padding:10,font:{size:9}}},tooltip:{...tip,callbacks:{label:c=>c.dataset.label+': '+Number(c.raw).toFixed(3)+' Hz'}}},scales:{x:{ticks:{color:t3,maxTicksLimit:9},grid:{color:gridC}},y:{min:freqYMin,max:freqYMax,ticks:{color:t3,callback:v=>Number(v).toFixed(1)+'Hz'},grid:{color:gridC}}}},plugins:[freqBandPlugin]});
      drawFreqHeatmap();
    }
    const freqCanvas=document.getElementById('freqHeatmap'),freqTooltip=document.getElementById('freqHeatTooltip');
    freqCanvas.addEventListener('mousemove',e=>{if(!freqHeatState)return;const rect=freqCanvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,s=freqHeatState;if(x<s.left||x>s.w-s.right||y<s.top||y>s.h-s.bottom){freqTooltip.style.display='none';return}const col=Math.min(s.cols-1,Math.floor((x-s.left)/s.cellW)),row=Math.min(s.rows-1,Math.floor((y-s.top)/s.cellH)),value=s.values[row][col],from=Math.floor(col*N/s.cols),time=Number(D[from]?.[TIME]);freqTooltip.innerHTML='<strong>'+frequencySeries[row].label+'</strong><span>'+(Number.isFinite(time)?time.toFixed(1):'--')+' h · '+value.toFixed(3)+' Hz · 偏差 '+(value-50>=0?'+':'')+(value-50).toFixed(3)+' Hz</span>';freqTooltip.style.left=x+'px';freqTooltip.style.top=y+'px';freqTooltip.style.display='block'});
    freqCanvas.addEventListener('mouseleave',()=>freqTooltip.style.display='none');
    freqCanvas.addEventListener('click',e=>{if(!freqHeatState)return;const rect=freqCanvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,s=freqHeatState;if(x<s.left||x>s.w-s.right||y<s.top||y>s.h-s.bottom)return;updateFreqDetail(Math.min(s.rows-1,Math.floor((y-s.top)/s.cellH))+1)});
    freqSelect.addEventListener('change',()=>updateFreqDetail(Number(freqSelect.value)));
    if(window.ResizeObserver)new ResizeObserver(()=>requestAnimationFrame(drawFreqHeatmap)).observe(freqCanvas.parentElement);
    updateFreqDetail(0);

    new Chart(document.getElementById('chartCostCompare'),{type:'bar',data:{labels:['燃料','切负荷','弃电'],datasets:[{label:'协同模式',data:[fuelC*.92,shedC*.7,curtC*.8],backgroundColor:'rgba(52,211,153,.8)',borderRadius:4},{label:'孤岛模式',data:[fuelC,shedC,curtC],backgroundColor:'rgba(251,90,103,.5)',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{tooltip:tip,legend:{position:'bottom',labels:{color:t2,usePointStyle:true,boxWidth:7,padding:12,font:{size:9}}}},scales:{x:{ticks:{color:t3},grid:{display:false}},y:{ticks:{color:t3},grid:{color:gridC}}}}});

    ld.classList.add('hidden');
  }catch(err){console.error(err);ld.classList.add('hidden');document.getElementById('mainContent').innerHTML='<div class="panel" style="grid-column:1/-1;padding:48px;text-align:center"><h2>数据加载失败</h2><p style="color:var(--text-2)">'+err.message+'</p></div>'}
}
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root {
  --bg-0:#060912;--bg-1:#09111f;
  --panel:rgba(15,24,39,.76);--panel-strong:rgba(17,27,44,.94);
  --border:rgba(148,163,184,.12);--border-active:rgba(96,165,250,.42);
  --text:#f4f7fb;--text-2:#98a6b9;--text-3:#5f6d80;
  --blue:#4f8cff;--blue-2:#79a6ff;--cyan:#22d3ee;--green:#34d399;
  --amber:#fbbf24;--red:#fb5a67;--orange:#fb923c;--violet:#8b8fff;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 12% 5%,rgba(59,130,246,.13),transparent 28%),radial-gradient(circle at 90% 18%,rgba(34,211,238,.08),transparent 24%),linear-gradient(145deg,var(--bg-0),var(--bg-1));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(96,165,250,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}
a{color:inherit}button{font:inherit}

.app-header{position:sticky;top:0;z-index:50;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg-1) 84%,transparent);backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none}
.brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;border:1px solid rgba(79,140,255,.24);background:linear-gradient(145deg,rgba(79,140,255,.18),rgba(34,211,238,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(29,78,216,.12)}
.brand-title{font-size:1.05rem;font-weight:750;letter-spacing:-.025em;white-space:nowrap}
.brand-sub{margin-top:2px;color:var(--text-3);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase}
.header-left,.header-right{display:flex;align-items:center;gap:14px}
.mode-badge{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.06em}
.mode-badge.cooperate{border:1px solid rgba(52,211,153,.28);background:rgba(52,211,153,.09);color:#4ade80}
.mode-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,211,153,.45);animation:modePulse 2.2s infinite}
@keyframes modePulse{55%{box-shadow:0 0 0 7px rgba(52,211,153,0)}}
.header-meta{display:flex;align-items:center;gap:18px;color:var(--text-2);font-size:.72rem}
.meta-item{display:flex;align-items:center;gap:7px;white-space:nowrap}
.mode-switch{display:flex;gap:2px;padding:3px;border:1px solid var(--border);border-radius:10px;background:rgba(148,163,184,.04)}
.mode-switch a{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;font-size:.68rem;font-weight:550;text-decoration:none;color:var(--text-2);transition:.2s ease}
.mode-switch a:hover,.mode-switch a.active{background:var(--panel-strong);color:var(--text)}
.sw-dot{width:5px;height:5px;border-radius:50%;background:currentColor}

.page-shell{position:relative;z-index:1;width:min(1660px,100%);margin:0 auto;padding:20px}
.panel{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.008)),var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 18px 50px rgba(0,0,0,.18);backdrop-filter:blur(18px)}
.panel::before{content:"";position:absolute;inset:0 0 auto;height:1px;opacity:.55;background:linear-gradient(90deg,transparent,rgba(125,211,252,.42),transparent)}
.section-eyebrow{color:var(--blue-2);font-size:.64rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.command-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.6fr);gap:16px;margin-bottom:16px}
.command-main{padding:24px;min-height:315px}
.command-side{padding:22px;min-height:315px}
.panel-head{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
.panel-title{margin:6px 0 0;font-size:1.05rem;font-weight:720;letter-spacing:-.025em}
.panel-desc{margin-top:6px;color:var(--text-3);font-size:.73rem}
.health-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;font-size:.68rem;font-weight:650;white-space:nowrap}
.health-chip.coop{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.20);color:var(--green)}
.health-chip.coop span{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}
.topology-wrap{position:relative;height:155px;margin-top:10px}
.topology-wrap svg{width:100%;height:100%;overflow:visible}
.flow-line{stroke-dasharray:7 10;animation:flowLine 1.8s linear infinite}
@keyframes flowLine{to{stroke-dashoffset:-34}}
.exchange-line{stroke-dasharray:4 6;animation:exchangeFlow 1.4s linear infinite}
@keyframes exchangeFlow{to{stroke-dashoffset:-20}}
.command-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:2px}
.command-metric{padding:12px 14px;border-radius:13px;border:1px solid rgba(148,163,184,.08);background:rgba(255,255,255,.025)}
.command-metric-label{color:var(--text-3);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase}
.command-metric-value{margin-top:5px;font-family:'JetBrains Mono',monospace;font-size:1.02rem;font-weight:650;font-variant-numeric:tabular-nums}
.command-metric-sub{margin-top:3px;color:var(--text-3);font-size:.62rem}
.kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi-card{min-height:148px;padding:18px}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kpi-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;color:var(--metric-color,var(--blue));background:color-mix(in srgb,var(--metric-color,var(--blue)) 12%,transparent)}
.kpi-tag{padding:5px 8px;border:1px solid rgba(148,163,184,.09);border-radius:999px;color:var(--text-3);font-size:.58rem}
.kpi-label{margin-top:16px;color:var(--text-2);font-size:.69rem}
.kpi-value{margin-top:5px;color:var(--metric-color,var(--text));font-family:'JetBrains Mono',monospace;font-size:1.72rem;line-height:1.1;font-weight:760;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.kpi-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;color:var(--text-3);font-size:.59rem}
.progress{height:3px;margin-top:10px;border-radius:99px;overflow:hidden;background:rgba(148,163,184,.10)}
.progress>span{display:block;width:var(--progress,0%);height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--metric-color,var(--blue)),color-mix(in srgb,var(--metric-color,var(--blue)) 55%,white));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.chart-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.span-6{grid-column:span 6}.span-3{grid-column:span 3}.span-12{grid-column:span 12}
.exchange-card{grid-column:span 12;min-height:610px;padding:22px}
.exchange-card canvas{max-height:none!important}
.exchange-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.exchange-select{height:34px;min-width:138px;padding:0 34px 0 11px;border:1px solid rgba(148,163,184,.14);border-radius:9px;outline:none;color:var(--text);background:var(--panel-strong);font-size:.66rem;cursor:pointer}
.exchange-select:focus{border-color:var(--border-active);box-shadow:0 0 0 3px rgba(79,140,255,.08)}
.exchange-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:2px 0 16px}
.exchange-summary-item{padding:10px 12px;border:1px solid rgba(148,163,184,.08);border-radius:11px;background:rgba(255,255,255,.022)}
.exchange-summary-label{color:var(--text-3);font-size:.57rem;letter-spacing:.06em;text-transform:uppercase}
.exchange-summary-value{margin-top:5px;font-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:650;font-variant-numeric:tabular-nums}
.exchange-section{padding:14px;border:1px solid rgba(148,163,184,.075);border-radius:14px;background:rgba(3,8,18,.18)}
.exchange-section+.exchange-section{margin-top:12px}
.exchange-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.exchange-section-title{font-size:.68rem;font-weight:650;color:var(--text-2)}
.exchange-section-note{font-size:.56rem;color:var(--text-3)}
.heatmap-wrap{position:relative;min-height:230px}
#exchangeHeatmap{display:block;width:100%!important;height:230px!important;max-height:230px!important;cursor:crosshair}
#chartExchangeDetail{display:block;width:100%!important;height:205px!important;max-height:205px!important}
.heatmap-scale{display:flex;align-items:center;gap:7px;color:var(--text-3);font-size:.55rem;white-space:nowrap}
.heatmap-gradient{width:92px;height:6px;border-radius:99px;background:linear-gradient(90deg,#4f8cff,#172033 50%,#fb923c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.heatmap-tooltip{position:absolute;z-index:8;display:none;pointer-events:none;min-width:128px;padding:8px 10px;border:1px solid rgba(148,163,184,.16);border-radius:9px;background:rgba(7,13,25,.96);box-shadow:0 12px 32px rgba(0,0,0,.28);color:var(--text);font-size:.61rem;line-height:1.55;transform:translate(10px,-105%)}
.heatmap-tooltip strong{display:block;font-size:.65rem}
.heatmap-tooltip span{color:var(--text-2);font-family:'JetBrains Mono',monospace}
@media(max-width:980px){.exchange-card{grid-column:span 1}.exchange-summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.exchange-summary{grid-template-columns:1fr 1fr}.exchange-toolbar{width:100%;justify-content:flex-start}.exchange-select{flex:1}.heatmap-scale{display:none}}
.chart-card{min-height:340px;padding:20px}
.chart-card canvas{width:100%!important;height:260px!important;max-height:260px}
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:15px}
.chart-title-wrap{display:flex;align-items:center;gap:11px}
.chart-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:rgba(79,140,255,.08);color:var(--blue-2)}
.chart-title{font-size:.84rem;font-weight:690;letter-spacing:-.015em}
.chart-subtitle{margin-top:4px;color:var(--text-3);font-size:.61rem}
.chart-status{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid rgba(148,163,184,.09);border-radius:999px;color:var(--text-3);font-size:.58rem}
.chart-status i{width:5px;height:5px;border-radius:50%;background:var(--green)}
.loading-cover{position:fixed;inset:68px 0 0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb,var(--bg-0) 72%,transparent);backdrop-filter:blur(8px);transition:opacity .35s ease,visibility .35s ease}
.loading-cover.hidden{opacity:0;visibility:hidden}
.loader{width:42px;height:42px;border:2px solid rgba(79,140,255,.15);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:14px;color:var(--text-2);font-size:.72rem}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:99px}
@media(max-width:1280px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.command-grid{grid-template-columns:1fr}.command-metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:980px){.app-header{height:auto;min-height:68px;padding:12px 18px}.header-meta{display:none}.page-shell{padding:14px}.chart-grid{grid-template-columns:1fr}.span-6,.span-3{grid-column:span 1}}
@media(max-width:680px){.brand-sub,.mode-badge{display:none}.kpi-grid{grid-template-columns:1fr 1fr;gap:10px}.command-metrics{grid-template-columns:1fr}}
</style>
</head>

      <div class="topology-wrap"><svg viewBox="0 0 900 185" fill="none"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee" stop-opacity=".18"/><stop offset=".5" stop-color="#4f8cff"/><stop offset="1" stop-color="#34d399" stop-opacity=".18"/></linearGradient><linearGradient id="coreF" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34d399" stop-opacity=".28"/><stop offset="1" stop-color="#4f8cff" stop-opacity=".08"/></linearGradient></defs><g opacity=".55"><path d="M160 45 C260 45 280 92 380 92" stroke="url(#lg1)" stroke-width="2" class="flow-line"/><path d="M160 95 C270 95 290 95 380 95" stroke="url(#lg1)" stroke-width="2" class="flow-line"/><path d="M160 145 C260 145 280 98 380 98" stroke="url(#lg1)" stroke-width="2" class="flow-line"/><path d="M520 92 C610 92 630 45 740 45" stroke="url(#lg1)" stroke-width="2" class="flow-line"/><path d="M520 95 C620 95 640 95 740 95" stroke="url(#lg1)" stroke-width="2" class="flow-line"/><path d="M520 98 C610 98 630 145 740 145" stroke="url(#lg1)" stroke-width="2" class="flow-line"/><path d="M450 70 C480 40 510 40 540 70" stroke="#34d399" stroke-width="1.5" class="exchange-line" opacity=".7"/><path d="M450 120 C480 150 510 150 540 120" stroke="#34d399" stroke-width="1.5" class="exchange-line" opacity=".7"/></g><g transform="translate(82 28)"><rect width="78" height="34" rx="10" fill="rgba(251,191,36,.08)" stroke="rgba(251,191,36,.22)"/><circle cx="18" cy="17" r="6" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/><text x="32" y="21" fill="var(--text-2)" font-size="11">光伏</text></g><g transform="translate(82 78)"><rect width="78" height="34" rx="10" fill="rgba(34,211,238,.08)" stroke="rgba(34,211,238,.22)"/><path d="M18 7v20M18 13l-9-5M18 13l8-7" stroke="#22d3ee" stroke-width="1.2"/><text x="32" y="21" fill="var(--text-2)" font-size="11">风电</text></g><g transform="translate(82 128)"><rect width="78" height="34" rx="10" fill="rgba(79,140,255,.08)" stroke="rgba(79,140,255,.22)"/><path d="M9 20c6-8 12 8 18 0" stroke="#4f8cff" stroke-width="1.4"/><text x="32" y="21" fill="var(--text-2)" font-size="11">潮汐</text></g><defs><filter id="softGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g transform="translate(380 35)" filter="url(#softGlow)"><circle cx="60" cy="60" r="57" fill="url(#coreF)" stroke="rgba(52,211,153,.45)"/><circle cx="60" cy="60" r="44" fill="rgba(7,13,25,.9)" stroke="rgba(125,255,200,.16)"/><path d="M60 31 45 59h12l-4 30 22-36H63l-3-22Z" fill="#34d399"/><text x="60" y="108" text-anchor="middle" fill="var(--text-3)" font-size="10">ADMM SOLVER</text></g><g transform="translate(740 28)"><rect width="84" height="34" rx="10" fill="rgba(52,211,153,.08)" stroke="rgba(52,211,153,.22)"/><text x="42" y="21" text-anchor="middle" fill="var(--text-2)" font-size="11">储能</text></g><g transform="translate(740 78)"><rect width="84" height="34" rx="10" fill="rgba(251,146,60,.08)" stroke="rgba(251,146,60,.22)"/><text x="42" y="21" text-anchor="middle" fill="var(--text-2)" font-size="11">燃机</text></g><g transform="translate(740 128)"><rect width="84" height="34" rx="10" fill="rgba(139,143,255,.08)" stroke="rgba(139,143,255,.22)"/><text x="42" y="21" text-anchor="middle" fill="var(--text-2)" font-size="11">负荷</text></g></svg></div>

<script>
async function loadCSV(f){const r=await fetch(f);if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();return Papa.parse(t.charCodeAt(0)===0xFEFF?t.slice(1):t,{header:true,dynamicTyping:true,skipEmptyLines:true})}

async function init(){
  const ld=document.getElementById('loadingCover');
  try{
    const ts=await loadCSV('cooperate_timeseries.csv');
    const F=(ts.meta&&ts.meta.fields)||[];
    const cleanField=f=>String(f||'').replace(/^﻿/,'').trim();
    const fieldMap=new Map(F.map(f=>[cleanField(f),f]));
    function col(n){return fieldMap.get(n)||F.find(f=>cleanField(f).includes(n))||n}
    const TIME=col('Time_h');
    let D=ts.data.filter(r=>r[TIME]!=null);if(!D.length)D=ts.data;
    if(!D.length)throw new Error('数据为空');

    const detectedIds=[...new Set(F.map(cleanField).map(f=>{const m=f.match(/^VPP(\d+)_(?:PV|Wind|Gas|Bat|Load|Shed|Curtail|Freq|SOC)(?:_kW|_Hz)?$/i);return m?Number(m[1]):null}).filter(Number.isFinite))].sort((a,b)=>a-b);
    const vppIds=detectedIds.length?detectedIds:[1,2,3];
    const Nv=vppIds.length;
    const exchangeCols=F.filter(f=>/^VPP\d+(?:[_-]?VPP)?[_-]?\d+_Exchange_kW$/i.test(cleanField(f)));
    const C={pv:[],wind:[],gas:[],bat:[],load:[],shed:[],curt:[],freq:[],soc:[],exch:[]};
    const fields={pv:'PV_kW',wind:'Wind_kW',gas:'Gas_kW',bat:'Bat_kW',load:'Load_kW',shed:'Shed_kW',curt:'Curtail_kW',freq:'Freq_Hz',soc:'SOC'};
    for(const vppId of vppIds){for(const[k,f]of Object.entries(fields)){C[k].push(col('VPP'+vppId+'_'+f))}}
    exchangeCols.forEach(cn=>{C.exch.push(cn)});
    C.resid=col('ADMM_Residual');
    // Per-link delay columns (dynamic, same link pattern as exchange)
    const delayCols=F.filter(f=>/^VPP\d+\d+_Delay_ms$/i.test(cleanField(f)));
    C.delay=delayCols.length?delayCols:[];
    const hasPerLinkDelay=C.delay.length>0;

    const N=D.length,dt=0.1;
    let tPV=0,tWind=0,tGas=0,tLoad=0,tShed=0,tCurt=0,ok=0,tExch=0,tDelay=0;
    for(var i=0;i<D.length;i++){var r=D[i];

      }
      const commCanvas=document.getElementById('commHeatmap');
      commCanvas.addEventListener('click',e=>{const rect=commCanvas.getBoundingClientRect(),y=e.clientY-rect.top;if(y<4||y>145-18)return;const rows=delaySeries.length,cellH=(145-4-18)/rows;updateCommDetail(Math.min(rows-1,Math.floor((y-4)/cellH)))});
      if(window.ResizeObserver)new ResizeObserver(()=>requestAnimationFrame(drawCommHeatmap)).observe(commCanvas.parentElement);
      drawCommHeatmap();updateCommDetail(0);
    }

    const skip=Math.max(1,Math.floor(N/48)),pv=[],w=[],g=[],b=[],tl=[];
    for(var i=0;i<N;i+=skip){var p=0,ww=0,gg=0,bb=0;for(var v=0;v<Nv;v++){p+=D[i][C.pv[v]]||0;ww+=D[i][C.wind[v]]||0;gg+=D[i][C.gas[v]]||0;bb+=Math.max(0,D[i][C.bat[v]]||0)}pv.push(p);w.push(ww);g.push(gg);b.push(bb);tl.push(labels[i])}
    new Chart(document.getElementById('chartPower'),{type:'bar',data:{labels:tl,datasets:[{label:'光伏',data:pv,backgroundColor:'rgba(251,191,36,.9)',borderRadius:3},{label:'风电',data:w,backgroundColor:'rgba(34,211,238,.9)',borderRadius:3},{label:'燃气',data:g,backgroundColor:'rgba(251,123,130,.9)',borderRadius:3},{label:'储能',data:b,backgroundColor:'rgba(52,211,153,.9)',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tip},scales:{x:{stacked:true,ticks:{color:t3,maxTicksLimit:12},grid:{display:false}},y:{stacked:true,ticks:{color:t3},grid:{color:gridC}}}}});

    const fAvg=D.map(r=>C.freq.reduce((s,c)=>s+(Number(r[c])||50),0)/Nv);
    const fCtx=document.getElementById('chartFreq').getContext('2d'),gF=fCtx.createLinearGradient(0,0,0,240);gF.addColorStop(0,'rgba(79,140,255,.22)');gF.addColorStop(1,'rgba(79,140,255,0)');
    new Chart(fCtx,{type:'line',data:{labels,datasets:[{data:fAvg,borderColor:'#4f8cff',backgroundColor:gF,borderWidth:2,pointRadius:0,tension:.34,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...tip,callbacks:{label:c=>c.raw.toFixed(3)+' Hz'}}},scales:{x:{ticks:{color:t3,maxTicksLimit:8},grid:{color:gridC}},y:{min:49,max:51,ticks:{color:t3},grid:{color:gridC}}}},plugins:[{id:'band',beforeDraw(chart){const{ctx,chartArea:{left,right},scales:{y}}=chart;ctx.save();ctx.fillStyle='rgba(52,211,153,.045)';ctx.fillRect(left,y.getPixelForValue(50.5),right-left,y.getPixelForValue(49.5)-y.getPixelForValue(50.5));ctx.restore()}}]});

    new Chart(document.getElementById('chartCostCompare'),{type:'bar',data:{labels:['燃料','切负荷','弃电'],datasets:[{label:'协同模式',data:[fuelC*.92,shedC*.7,curtC*.8],backgroundColor:'rgba(52,211,153,.8)',borderRadius:4},{label:'孤岛模式',data:[fuelC,shedC,curtC],backgroundColor:'rgba(251,90,103,.5)',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{tooltip:tip,legend:{position:'bottom',labels:{color:t2,usePointStyle:true,boxWidth:7,padding:12,font:{size:9}}}},scales:{x:{ticks:{color:t3},grid:{display:false}},y:{ticks:{color:t3},grid:{color:gridC}}}}});

    ld.classList.add('hidden');
  }catch(err){console.error(err);ld.classList.add('hidden');document.getElementById('mainContent').innerHTML='<div class="panel" style="grid-column:1/-1;padding:48px;text-align:center"><h2>数据加载失败</h2><p style="color:var(--text-2)">'+err.message+'</p></div>'}
}
init();
</script>
</body>
</html>
